spring.application.name=event-management-system

# XAMPP MySQL default settings (default user root, no password)
spring.datasource.url=jdbc:mysql://localhost:3306/event_management_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

#Disable Spring Security (for development only)
spring.security.basic.enabled=false
spring.security.user.password=password