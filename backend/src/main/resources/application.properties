# FOR LOCAL/STANDALONE TESTING ONLY.
# Skip this file if the real repo already has application.properties/yml
# with its own DB config — just merge the dummy.user.email line below in.

server.port=8080

# Point this at the database you created from schema.sql
spring.datasource.url=jdbc:mysql://localhost:3306/event_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql already creates the tables by hand, so don't let Hibernate
# try to also create/alter them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Email used by DummySecurityConfig / DummyDataSeeder as the "logged in"
# student for every request.
dummy.user.email=student@test.com
